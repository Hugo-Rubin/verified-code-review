[package]
name = "verified-code-reviewer"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
description = "A repository-aware LLM code reviewer that falsifies its own findings in a fresh context before reporting them."
repository = "https://github.com/hugorubin/verified-code-review"

[[bin]]
name = "vcr"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "process"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
